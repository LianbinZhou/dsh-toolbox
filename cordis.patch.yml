# dsh-toolbox bundle patch: one row, six volatile switches, plus the official
# session-search seam this package takes over from the retired dsh-session-search.
#
# ---------------------------------------------------------------------------
# 1) The official full-text seam. `dsh-base` mounts `session-query-sqlite` with
#    `openAt: never` + an in-memory index, which keeps `ctx.sessionQuery` alive
#    for reads but makes `searchSessions` fail with SESSION_QUERY_SEARCH_DISABLED.
#    Re-declaring the same id here replaces its config: a durable index, opened
#    lazily on the first search.
#
#    This is a STATIC patch layer. A runtime switch CANNOT turn it off — the
#    `sessionSearch` switch only controls the agent-facing tool. That is
#    deliberate and documented in the README.
#
#    NOTE: `path` is required by the official schema, but it must NEVER be a
#    machine specific absolute path. v0.7.1 hardcoded the author's own home
#    directory here, which silently broke session search on every other machine
#    (the path does not exist there). Since v0.7.3 the published bundle uses
#    `:memory:` instead, so it is portable by construction:
#
#      · the index lives in this process only, and is rebuilt on the first
#        search after every start (`openAt: first-search`); nothing is written
#        to disk and nothing can point at a foreign user's directory;
#      · a launcher that knows a genuine per-user location can still supply one
#        through the boot-context slot `launcherSessionQueryPath`.
#
#    Cost of `:memory:`: the index is not persisted across restarts, so the
#    first search after each start pays a one-off rebuild. That is the trade we
#    accept for a bundle other people can install safely.
# ---------------------------------------------------------------------------
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search

# ---------------------------------------------------------------------------
# 2) The toolbox row. The settings card is rendered by this bundle's own client
#    half, registered on `plugins.row.config` under the key `dsh-toolbox#toolbox`.
#    There is no automatic form: a row without a registered cell shows nothing.
# ---------------------------------------------------------------------------
- insert:
    - id: toolbox
      name: 'dsh-toolbox'
      config:
        quoteReply: true
        draftSaver: true
        panelMenu: true
        archivePanel: true
        pluginZh: true
        sessionSearch: true
